name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Placeholder; the app only needs a syntactically valid URL to build
  NEXT_PUBLIC_API_URL: https://api.example.com/api

jobs:
  checks:
    name: Typecheck, lint, i18n, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npx vitest run --coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  demo-guard:
    name: Demo mode is blocked in production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with NEXT_PUBLIC_DEMO_MODE=true must fail
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: |
          if npm run build > build.log 2>&1; then
            echo "::error::Production build succeeded with demo mode enabled"
            exit 1
          fi
          grep -q "SECURITY VIOLATION" build.log || { cat build.log; echo "::error::Build failed for an unexpected reason"; exit 1; }
          echo "Build was correctly blocked by the demo-mode guard."

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      API_PROXY_TARGET: http://127.0.0.1:4500
      NEXT_PUBLIC_API_URL: http://localhost:3100/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
