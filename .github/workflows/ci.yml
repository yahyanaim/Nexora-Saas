name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Placeholder; the app only needs a syntactically valid URL to build
  NEXT_PUBLIC_API_URL: https://api.example.com/api

# Runners are pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 cannot install Chromium
jobs:
  checks:
    name: Typecheck, lint, i18n, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      # C-01: no text without a use
      - run: npm run i18n:unused
      # PERF-03, PERF-04
      - run: npm run check:images
      - run: npm run check:build-scripts
      - run: npx vitest run --coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # PERF-02: JavaScript per page; fails above the ceiling in scripts/js-budget.json
      - run: npm run check:js-budget

  a11y:
    name: Accessibility of the console and company pages (axe)
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_API_URL: http://localhost:59999/api
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_ALLOW_DEMO_BUILD: "true"
      ALLOW_DEMO_BUILD: "true"
      BASE_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser comes from Playwright's CDN. Its system packages come from Ubuntu's mirror,
      # which can be unreachable from the runner; the runner image already has Chromium's
      # libraries, so a mirror outage gives a warning instead of a red job before any test.
      - run: npx playwright install chromium
      - run: npx playwright install-deps chromium || echo "::warning::Ubuntu mirror unreachable; using the runner image's libraries"
      - run: npm run build
      - name: Start the demo build
        run: |
          npx next start -p 3200 > start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3200/en/auth && exit 0; sleep 2; done
          cat start.log; exit 1
      # A11Y-03 to A11Y-05: every console page, critical and serious findings block
      - run: npm run a11y:console
      # A2.3: the main company (ERP) pages, same rules
      - run: npm run a11y:erp
      - name: The check fails on a seeded violation
        run: |
          if npm run a11y:console -- --seed-violation > seeded.log 2>&1; then
            cat seeded.log; echo "::error::The accessibility check passed with a seeded violation"; exit 1
          fi
          grep -q "button-name" seeded.log || { cat seeded.log; exit 1; }
          echo "The accessibility check blocks a seeded violation."

  demo-guard:
    name: Demo mode is blocked in production builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with NEXT_PUBLIC_DEMO_MODE=true must fail
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: |
          if npm run build > build.log 2>&1; then
            echo "::error::Production build succeeded with demo mode enabled"
            exit 1
          fi
          grep -q "SECURITY VIOLATION" build.log || { cat build.log; echo "::error::Build failed for an unexpected reason"; exit 1; }
          echo "Build was correctly blocked by the demo-mode guard."

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    env:
      API_PROXY_TARGET: http://127.0.0.1:4500
      NEXT_PUBLIC_API_URL: http://localhost:3100/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser comes from Playwright's CDN. Its system packages come from Ubuntu's mirror,
      # which can be unreachable from the runner; the runner image already has Chromium's
      # libraries, so a mirror outage gives a warning instead of a red job before any test.
      - run: npx playwright install chromium
      - run: npx playwright install-deps chromium || echo "::warning::Ubuntu mirror unreachable; using the runner image's libraries"
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    name: Secret scan (SCR-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # gitleaks, a pinned release checked against its published SHA-256 before it runs.
      - name: Install gitleaks 8.28.0
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the files of this commit
        run: ./gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1
