<!doctype html>
<!--
  Nexora — teaser video (1920×1080, 30 fps, about 39 s), after the reference teaser
  (marketing/video/reference-teaser.mp4): the product UI floating on a deep-blue
  backdrop, a camera that tilts, zooms and pans, screens that fill in piece by piece,
  a cursor that clicks, and title cards between the scenes.
  Every screen is a real capture of the app (assets/, made by capture.mjs);
  window.render(t) draws the frame at t seconds and render.mjs encodes the MP4.
  Open the file in a browser with ?play to watch it live.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920" />
<title>Nexora — teaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Geist:wght@500;700&family=Geist+Mono:wght@500&display=block" rel="stylesheet" />
<style>
  :root { --deep: #062455; --blue-800: #093a8f; --blue-700: #0e4fb3; --blue-300: #82beff; --brand: #2684ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--deep); font-family: "IBM Plex Sans Arabic", "Geist", sans-serif; }
  #stage > * { position: absolute; }
  canvas { left: 0; top: 0; }
  #cam { left: 0; top: 0; width: 1920px; height: 1080px; }
  .view { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 2600px; perspective-origin: 960px 540px; will-change: filter, opacity; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform-style: preserve-3d; border-radius: 22px; background: #f4f8fb; box-shadow: 0 50px 140px rgb(2 10 30 / 0.55), 0 0 0 1px rgb(255 255 255 / 0.08); will-change: transform; }
  .layer, .tile { position: absolute; background-repeat: no-repeat; will-change: opacity, transform, clip-path; }
  .layer { left: 0; top: 0; width: 100%; height: 100%; border-radius: 22px; }
  .tile.pop { border-radius: 14px; box-shadow: 0 30px 60px -18px rgb(2 10 30 / 0.45); }
  #cursor { width: 34px; height: 46px; left: 0; top: 0; z-index: 30; will-change: transform; filter: drop-shadow(0 6px 10px rgb(0 0 0 / 0.28)); }
  #ripple { width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 3px solid rgb(38 132 255 / 0.9); z-index: 29; }

  /* title cards */
  .card { left: 0; top: 0; width: 1920px; height: 1080px; z-index: 40; }
  .card .bg { position: absolute; inset: 0; background: radial-gradient(1100px 700px at 50% 55%, #0e4fb3 0%, #093a8f 38%, #062455 75%, #041a3f 100%); }
  .card canvas { position: absolute; }
  .card .txt { position: absolute; right: 300px; top: 380px; width: 1100px; text-align: right; color: #fff; }
  .label { font-family: "Geist Mono", monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.24em; color: var(--blue-300); direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .label i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); margin: 0 14px 3px 0; box-shadow: 0 0 12px var(--brand); vertical-align: middle; }
  .big { margin-top: 18px; font-weight: 700; font-size: 110px; line-height: 1.18; letter-spacing: -0.01em; }
  .big span { display: inline-block; will-change: opacity, filter, transform; }
  .stats { margin-top: 22px; font-size: 34px; color: rgb(255 255 255 / 0.74); }
  .stats b { color: #fff; font-weight: 500; }
  .end .txt { right: 0; left: 0; width: auto; top: 330px; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 30px; direction: ltr; margin-top: 26px; }
  .brand img { height: 128px; filter: brightness(0) invert(1); }
  .brand span { font-family: "Geist", sans-serif; font-weight: 700; font-size: 120px; letter-spacing: -0.04em; }
  .tag { margin-top: 26px; font-size: 44px; color: rgb(255 255 255 / 0.82); }
  .soon { display: inline-block; margin-top: 40px; padding: 14px 40px; border-radius: 999px; background: #fff; color: var(--blue-700); font-weight: 700; font-size: 32px; }
  #vignette { left: 0; top: 0; width: 1920px; height: 1080px; z-index: 50; pointer-events: none; background: radial-gradient(1400px 900px at 50% 50%, transparent 60%, rgb(2 10 30 / 0.35) 100%); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky" width="1920" height="1080"></canvas>
  <div id="cam"></div>
  <div id="ripple"></div>
  <svg id="cursor" viewBox="0 0 34 46" aria-hidden="true"><path d="M3 2 L3 36 L11.5 28 L17.5 42 L23 39.6 L17 26 L29 26 Z" fill="#0d131c" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" /></svg>

  <div class="card" id="tc">
    <div class="bg"></div>
    <canvas class="stars" width="2200" height="1300" style="left:-140px;top:-110px"></canvas>
    <div class="txt">
      <div class="label" id="tc-label"><i></i>INV-2026-025 · INVOICE</div>
      <div class="big" id="tc-title"><span>فاتورة</span> <bdi dir="ltr"><span>Helio</span> <span>Energy</span></bdi></div>
      <div class="stats" id="tc-stats"><b>48</b> ساعة معتمدة · <b>74,520 د.م.</b> شاملة الضريبة</div>
    </div>
  </div>

  <div class="card end" id="ec">
    <div class="bg"></div>
    <canvas class="stars" width="2200" height="1300" style="left:-140px;top:-110px"></canvas>
    <div class="txt">
      <div class="label" id="ec-label"><i></i>NEXORA ERP · 2026</div><br />
      <div class="brand" id="ec-brand"><img src="../social/assets/nexora-mark.png" alt="" /><span>Nexora ERP</span></div>
      <div class="tag" id="ec-tag">من الساعة… إلى الفاتورة… إلى الربح</div>
      <div class="soon" id="ec-soon">قريبًا</div>
    </div>
  </div>
  <div id="vignette"></div>
</div>

<script>
;(async function () {
  const DURATION = 39.5
  window.DURATION = DURATION
  window.FPS = 30
  const shots = await (await fetch("assets/shots.json")).json()
  const B = shots.boxes
  const $ = (id) => document.getElementById(id)

  /* ── easing ── */
  const clamp = (x) => Math.max(0, Math.min(1, x))
  const P = (t, a, d) => clamp((t - a) / d)
  const outCubic = (x) => 1 - Math.pow(1 - x, 3)
  const inCubic = (x) => x * x * x
  const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
  const outBack = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2)
  const lerp = (a, b, x) => a + (b - a) * x
  const EASE = { inOut, out: outCubic, in: inCubic, linear: (x) => x }

  /* ── backdrop: deep blue with stars ── */
  let seed = 7
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
  const STARS = Array.from({ length: 420 }, () => ({ x: rnd(), y: rnd(), r: rnd() < 0.85 ? 0.6 + rnd() * 0.9 : 1.4 + rnd() * 1.2, a: 0.15 + rnd() * 0.65, tw: rnd() * 6.28 }))
  function drawSky(cv, t, drift) {
    const g = cv.getContext("2d"), W = cv.width, H = cv.height
    g.clearRect(0, 0, W, H)
    if (cv.id === "sky") {
      const bg = g.createRadialGradient(W * 0.5, H * 0.58, 50, W * 0.5, H * 0.58, W * 0.75)
      bg.addColorStop(0, "#0e4fb3"); bg.addColorStop(0.42, "#093a8f"); bg.addColorStop(0.8, "#062455"); bg.addColorStop(1, "#041a3f")
      g.fillStyle = bg; g.fillRect(0, 0, W, H)
    }
    for (const s of STARS) {
      const x = ((s.x * W + drift * s.r * 14) % W + W) % W, y = s.y * H
      g.globalAlpha = s.a * (0.65 + 0.35 * Math.sin(t * 1.3 + s.tw))
      g.fillStyle = "#cfe3ff"
      g.beginPath(); g.arc(x, y, s.r, 0, 6.283); g.fill()
    }
    g.globalAlpha = 1
  }

  /* ── worlds: one real screen each, with layers and reveal tiles ── */
  const cam = $("cam")
  const url = (name) => `url(assets/${name}.webp)`
  function makeWorld(h) {
    const v = document.createElement("div")
    v.className = "view"
    const w = document.createElement("div")
    w.className = "world"
    w.style.width = shots.width + "px"
    w.style.height = h + "px"
    v.appendChild(w)
    cam.appendChild(v)
    return w
  }
  function layer(world, name) {
    const d = document.createElement("div")
    d.className = "layer"
    d.style.backgroundImage = url(name)
    d.style.backgroundSize = "100% 100%"
    world.appendChild(d)
    return d
  }
  function tile(world, name, b, pad = 0) {
    const d = document.createElement("div")
    d.className = "tile"
    const x = b.x - pad, y = b.y - pad, w = b.w + pad * 2, h = b.h + pad * 2
    Object.assign(d.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px", backgroundImage: url(name), backgroundPosition: `${-x}px ${-y}px`, backgroundSize: `${shots.width}px ${shots.images[name].h}px` })
    world.appendChild(d)
    return d
  }
  const show = (el, o, y = 0, x = 0, s = 1, z = 0) => {
    el.style.opacity = o
    el.style.visibility = o <= 0.001 ? "hidden" : "visible"
    el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) scale(${s})`
  }

  // W1: client invoices → create-invoice sheet → draft → issued
  const W1 = makeWorld(1000)
  const L = {}
  for (const n of ["invoices", "sheet-0", "sheet-1", "sheet-2", "sheet-3", "sheet-4", "sheet-5", "draft-empty", "issued-empty"]) L[n] = layer(W1, n)
  const sheetPanel = tile(W1, "sheet-0", B.sheet.dialog, 12)
  const draftTiles = B.draft.sections.map((s) => tile(W1, "draft", s, 4))
  const issuedTiles = B.issued.sections.map((s) => (/DGI|دفعة/.test(s.text) ? tile(W1, "issued", s, 4) : null))
  const toast = tile(W1, "issued-toast", B.issued.toast, 14)
  const popTiles = [...B.invoices.cards, B.invoices.readyCard].map((c) => {
    const d = tile(W1, "invoices", c, 1)
    d.classList.add("pop")
    return d
  })

  // W2: timeline of every project
  const T = B.timeline
  const W2 = makeWorld(shots.images.timeline.h)
  layer(W2, "timeline-empty")
  const rowTiles = T.rows.map((r) => tile(W2, "timeline-rows", r, 4))
  const todayTile = T.today ? tile(W2, "timeline", T.today, 6) : null
  const barTiles = T.bars.map((b) => tile(W2, "timeline", b, 6))
  const markTiles = T.marks.map((m) => tile(W2, "timeline", m, 6))

  // W3: analytics
  const O = B.overview
  const W3 = makeWorld(shots.images.overview.h)
  layer(W3, "overview-empty")
  const cardTiles = O.cards.map((c) => {
    const d = tile(W3, "overview", c, 2)
    if (c.kpi || c.chart) d.classList.add("pop")
    return d
  })
  const chartCovers = O.cards.map((c) => (c.chart ? tile(W3, "overview-empty", c.chart, 2) : null))
  // reveal order: KPI tiles from the right (RTL), then rows top to bottom, right to left
  const order = O.cards.map((c, i) => i).sort((a, b) => O.cards[a].y - O.cards[b].y || O.cards[b].x - O.cards[a].x)

  /* ── camera keys: centre (cx, cy) in page px, zoom z, tilt rx/ry/rz, screen offset oy, blur b, opacity o ── */
  const K = (t, v) => ({ t, ...v })
  const CAMS = new Map([
    [W1, [
      K(0, { cx: 960, cy: 470, z: 1.0, rx: 24, ry: -20, rz: 7, oy: 0, b: 0, o: 1 }),
      K(1.9, { cx: 1040, cy: 540, z: 1.2, rx: 0, ry: 0, rz: 0 }),
      K(2.7, { cx: 1120, cy: 570, z: 1.6 }),
      K(3.3, { cx: 1100, cy: 565, z: 1.6 }),
      K(3.85, { cx: 660, cy: 500, z: 1.22 }),
      K(4.35, { cx: 330, cy: 430, z: 2.05 }),
      K(6.3, { cx: 320, cy: 470, z: 2.05 }),
      K(7.0, { cx: 290, cy: 760, z: 2.05 }),
      K(7.35, { cx: 260, cy: 800, z: 2.1 }),
      K(8.0, { cx: 150, cy: 917, z: 4.6, b: 28, o: 0, e: "in" }),
      K(10.45, { cx: 320, cy: 470, z: 3.2, b: 22, o: 0 }),
      K(11.25, { cx: 320, cy: 470, z: 1.85, b: 0, o: 1, e: "out" }),
      K(12.7, { cx: 320, cy: 520, z: 1.85 }),
      K(13.4, { cx: 300, cy: 760, z: 1.95 }),
      K(13.75, { cx: 300, cy: 760, z: 1.95 }),
      K(14.55, { cx: 560, cy: 255, z: 1.6 }),
      K(15.3, { cx: 560, cy: 255, z: 1.6 }),
      K(16.1, { cx: 300, cy: 690, z: 1.95 }),
      K(17.35, { cx: 300, cy: 690, z: 2.0 }),
      K(18.05, { cx: 300, cy: 620, z: 2.15, oy: -320, b: 12, o: 0, e: "in" }),
    ]],
    [W2, [
      K(17.45, { cx: 800, cy: 690, z: 1.12, rx: 0, ry: 0, rz: 0, oy: 760, b: 10, o: 0 }),
      K(18.35, { cx: 800, cy: 690, z: 1.2, oy: 0, b: 0, o: 1, e: "out" }),
      K(20.2, { cx: 760, cy: 690, z: 1.24 }),
      K(25.0, { cx: 640, cy: 760, z: 1.62 }),
      K(25.85, { cx: 620, cy: 740, z: 1.75, oy: -320, b: 12, o: 0, e: "in" }),
    ]],
    [W3, [
      K(25.3, { cx: 800, cy: 470, z: 1.12, rx: 0, ry: 0, rz: 0, oy: 760, b: 10, o: 0 }),
      K(26.2, { cx: 800, cy: 470, z: 1.2, oy: 0, b: 0, o: 1, e: "out" }),
      K(27.7, { cx: 800, cy: 480, z: 1.2 }),
      K(29.6, { cx: 800, cy: 830, z: 1.32 }),
      K(31.4, { cx: 800, cy: 1270, z: 1.32 }),
      K(33.1, { cx: 800, cy: 1600, z: 1.3 }),
      K(35.0, { cx: 860, cy: 760, z: 0.95, rx: 22, ry: -20, rz: 6 }),
      K(39.5, { cx: 860, cy: 820, z: 0.86, rx: 20, ry: -24, rz: 6, e: "linear" }),
    ]],
  ])
  function camAt(keys, t) {
    if (t <= keys[0].t) return { ...keys[0] }
    let cur = { ...keys[0] }
    for (let i = 1; i < keys.length; i++) {
      const a = cur, k = keys[i], next = { ...a, ...k }
      if (t < k.t) {
        const x = (EASE[k.e ?? "inOut"])(clamp((t - keys[i - 1].t) / (k.t - keys[i - 1].t)))
        const out = {}
        for (const key of ["cx", "cy", "z", "rx", "ry", "rz", "oy", "b", "o"]) out[key] = lerp(a[key], next[key], x)
        return out
      }
      cur = next
    }
    return cur
  }
  function place(world, c, prev) {
    world.style.transform = `translate(960px, ${540 + c.oy}px) rotateX(${c.rx}deg) rotateY(${c.ry}deg) rotateZ(${c.rz}deg) scale(${c.z}) translate(${-c.cx}px, ${-c.cy}px)`
    // motion blur: how far the picture moves in one frame
    const move = Math.hypot((c.cx - prev.cx) * c.z, (c.cy - prev.cy) * c.z, c.oy - prev.oy) + Math.abs(Math.log(c.z / prev.z)) * 900 + (Math.abs(c.rx - prev.rx) + Math.abs(c.ry - prev.ry) + Math.abs(c.rz - prev.rz)) * 20
    const blur = c.b + Math.min(6, Math.max(0, move - 8) * 0.075)
    const view = world.parentElement
    view.style.opacity = c.o
    view.style.visibility = c.o <= 0.001 ? "hidden" : "visible"
    view.style.filter = blur > 0.15 ? `blur(${blur.toFixed(2)}px)` : "none"
  }
  // page px → screen px, for a flat camera
  const toScreen = (c, x, y) => [960 + (x - c.cx) * c.z, 540 + c.oy + (y - c.cy) * c.z]

  /* ── cursor: path in page px of W1, with clicks ── */
  const S = B.sheet
  const mid = (b) => [b.x + b.w / 2, b.y + b.h / 2]
  const rowPoint = (i) => [300, S.checks[i].y + 9]
  const CURSOR = [
    { t: 2.3, p: [1290, 760], o: 0 },
    { t: 2.55, p: [1290, 760], o: 1 },
    { t: 3.15, p: mid(B.invoices.ready), click: true },
    { t: 4.45, p: rowPoint(0), click: true },
    { t: 4.95, p: rowPoint(1), click: true },
    { t: 5.45, p: rowPoint(2), click: true },
    { t: 5.95, p: rowPoint(3), click: true },
    { t: 6.45, p: rowPoint(4), click: true },
    { t: 7.25, p: mid(S.create), click: true },
    { t: 7.6, p: mid(S.create), o: 0 },
    { t: 12.8, p: [520, 690], o: 0 },
    { t: 13.0, p: [520, 690], o: 1 },
    { t: 13.55, p: mid(B.draft.issue), click: true },
    { t: 15.7, p: [470, 640] },
    { t: 16.6, p: mid(B.issued.sendDgi) },
    { t: 17.4, p: mid(B.issued.sendDgi), o: 0 },
  ]
  const clicks = CURSOR.filter((c) => c.click).map((c) => c.t)
  function cursorAt(t) {
    let a = CURSOR[0]
    for (let i = 1; i < CURSOR.length; i++) {
      const b = CURSOR[i]
      if (t < b.t) {
        const x = inOut(clamp((t - a.t) / (b.t - a.t)))
        // a gentle arc between points
        const arc = Math.sin(x * Math.PI) * Math.min(60, Math.hypot(b.p[0] - a.p[0], b.p[1] - a.p[1]) * 0.12)
        return { x: lerp(a.p[0], b.p[0], x), y: lerp(a.p[1], b.p[1], x) - arc, o: lerp(a.o ?? 1, b.o ?? 1, x) }
      }
      a = { ...b, o: b.o ?? 1 }
    }
    return { x: a.p[0], y: a.p[1], o: 0 }
  }

  /* ── title cards ── */
  const words = [...$("tc-title").querySelectorAll("span")]
  const tcStars = document.querySelector("#tc canvas"), ecStars = document.querySelector("#ec canvas")
  const sky = $("sky")

  /* ── the frame at t seconds ── */
  window.render = function (t) {
    drawSky(sky, t, t * 0.6)

    // W1 layers: which state of the invoices page is on screen
    const C1 = camAt(CAMS.get(W1), t)
    place(W1, C1, camAt(CAMS.get(W1), t - 1 / 30))
    const sheetIn = outCubic(P(t, 3.22, 0.45))
    const ticks = clicks.slice(1, 6).filter((c) => t >= c + 0.06).length
    show(L.invoices, t < 3.6 ? 1 : 0)
    for (let i = 0; i <= 5; i++) show(L[`sheet-${i}`], t >= 3.22 && t < 7.4 && i === ticks ? (i === 0 ? clamp(P(t, 3.22, 0.25)) : 1) : t >= 7.4 && t < 8.1 && i === 5 ? 1 : 0)
    show(sheetPanel, t >= 3.22 && t < 3.75 ? 1 : 0, 0, (1 - sheetIn) * -480)
    // in the tilted opening the cards float above the page, then settle
    const lift = 1 - inOut(P(t, 0.25, 1.55))
    popTiles.forEach((d) => show(d, t < 3.6 ? 1 : 0, 0, 0, 1, lift * 90))
    const issuedAt = clicks[7] + 0.08
    show(L["draft-empty"], t >= 8.1 && t < issuedAt ? 1 : 0)
    draftTiles.forEach((d, i) => {
      const a = 11.05 + i * 0.24, p = outCubic(P(t, a, 0.45))
      show(d, t < issuedAt ? clamp(P(t, a, 0.3)) : 0, (1 - p) * 26)
    })
    show(L["issued-empty"], t >= issuedAt ? 1 : 0)
    issuedTiles.forEach((d, i) => {
      if (!d) return
      const a = 15.25 + (i === 3 ? 0 : 0.3), p = outCubic(P(t, a, 0.5))
      show(d, t >= issuedAt ? clamp(P(t, a, 0.35)) : 0, (1 - p) * 30)
    })
    {
      const i = outBack(P(t, issuedAt + 0.05, 0.5), 1.4), e = inCubic(P(t, 16.6, 0.35))
      show(toast, t >= issuedAt ? clamp(P(t, issuedAt, 0.2)) * (1 - e) : 0, lerp(-90, 0, i) - e * 90)
    }

    // W2 timeline
    const C2 = camAt(CAMS.get(W2), t)
    place(W2, C2, camAt(CAMS.get(W2), t - 1 / 30))
    rowTiles.forEach((d, i) => {
      const a = 18.5 + i * 0.13, p = outCubic(P(t, a, 0.5))
      show(d, clamp(P(t, a, 0.3)), 0, (1 - p) * 40)
    })
    if (todayTile) {
      const p = inOut(P(t, 19.3, 0.9))
      todayTile.style.opacity = t > 19.3 ? 1 : 0
      todayTile.style.clipPath = `inset(0 0 ${(1 - p) * 100}% 0)`
    }
    barTiles.forEach((d, i) => {
      const a = 19.7 + i * 0.28, p = outCubic(P(t, a, 0.9))
      d.style.opacity = t > a ? 1 : 0
      // bars start on the right (RTL) and grow to the left
      d.style.clipPath = `inset(0 0 0 ${(1 - p) * 100}% round 18px)`
    })
    markTiles.forEach((d, i) => {
      const a = 21.4 + i * 0.16
      show(d, clamp(P(t, a, 0.15)), 0, 0, outBack(P(t, a, 0.4), 2.4))
    })

    // W3 analytics
    const C3 = camAt(CAMS.get(W3), t)
    place(W3, C3, camAt(CAMS.get(W3), t - 1 / 30))
    order.forEach((ci, k) => {
      const c = O.cards[ci]
      const a = c.kpi ? 26.55 + k * 0.17 : c.y < 1000 ? 28.0 + (k - 4) * 0.3 : c.y < 1400 ? 30.0 + (k - 6) * 0.3 : 31.7 + (k - 8) * 0.25
      const p = outCubic(P(t, a, 0.55))
      const lift = c.kpi || c.chart ? inOut(P(t, 33.3, 1.7)) * (c.kpi ? 110 : 60) : 0
      show(cardTiles[ci], clamp(P(t, a, 0.35)), (1 - p) * 34, 0, 1, lift)
      const cover = chartCovers[ci]
      if (cover) {
        // the chart draws from left to right once its card is in
        const w = inOut(P(t, a + 0.35, 1.3))
        show(cover, t >= a ? 1 : 0, (1 - p) * 34, 0, 1, lift)
        cover.style.clipPath = `inset(0 0 0 ${w * 100}%)`
      }
    })

    // cursor and clicks (W1 only, flat camera)
    const cu = cursorAt(t)
    const [sx, sy] = toScreen(C1, cu.x, cu.y)
    const clickNow = clicks.find((c) => t >= c && t < c + 0.45)
    const press = clickNow !== undefined && t < clickNow + 0.12 ? 0.86 : 1
    const cur = $("cursor")
    cur.style.opacity = cu.o * C1.o
    cur.style.visibility = cu.o * C1.o < 0.01 ? "hidden" : "visible"
    cur.style.transform = `translate(${sx - 4}px, ${sy - 3}px) scale(${press})`
    const rp = $("ripple")
    if (clickNow !== undefined && cu.o > 0.5) {
      const r = outCubic(P(t, clickNow, 0.45))
      rp.style.visibility = "visible"
      rp.style.opacity = (1 - r) * 0.9
      rp.style.transform = `translate(${sx}px, ${sy}px) scale(${0.2 + r * 0.9})`
    } else rp.style.visibility = "hidden"

    // title card 8.0–10.9
    {
      const i = P(t, 7.75, 0.45), e = inCubic(P(t, 10.45, 0.5))
      const tc = $("tc")
      tc.style.opacity = i * (1 - e)
      tc.style.visibility = i * (1 - e) < 0.01 ? "hidden" : "visible"
      if (i * (1 - e) > 0) {
        drawSky(tcStars, t, (t - 7.75) * 9)
        const lab = outCubic(P(t, 8.15, 0.5))
        $("tc-label").style.opacity = lab
        $("tc-label").style.transform = `translateY(${(1 - lab) * 12}px)`
        words.forEach((w, k) => {
          const p = outCubic(P(t, 8.35 + k * 0.22, 0.6))
          w.style.opacity = p
          w.style.filter = `blur(${(1 - p) * 18 + e * 14}px)`
          w.style.transform = `translateY(${(1 - p) * 26}px) scale(${1 + e * 0.12})`
        })
        const st = outCubic(P(t, 9.25, 0.6))
        $("tc-stats").style.opacity = st * (1 - e)
        $("tc-stats").style.transform = `translateY(${(1 - st) * 14}px)`
      }
    }

    // end card 35.9–39.5
    {
      const i = P(t, 36.4, 0.9)
      const ec = $("ec")
      ec.style.opacity = i
      ec.style.visibility = i < 0.01 ? "hidden" : "visible"
      if (i > 0) {
        drawSky(ecStars, t, (t - 36.4) * 7)
        const seq = [["ec-label", 36.85], ["ec-brand", 37.1], ["ec-tag", 37.7], ["ec-soon", 38.25]]
        for (const [id, a] of seq) {
          const p = outCubic(P(t, a, 0.7))
          const el = $(id)
          el.style.opacity = p
          el.style.filter = `blur(${(1 - p) * 14}px)`
          el.style.transform = `translateY(${(1 - p) * 22}px) scale(${id === "ec-soon" ? outBack(P(t, a, 0.6), 1.6) : 1})`
        }
      }
    }
  }

  window.render(0)
  window.ready = true
  if (location.search.includes("play")) {
    const t0 = performance.now()
    const loop = () => { window.render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }
    requestAnimationFrame(loop)
  }
})()
</script>
</body>
</html>
