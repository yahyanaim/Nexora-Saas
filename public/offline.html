<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2684ff">
<title>Nexora · Offline</title>
<style>
  :root { --bg: #f4f7fb; --card: #ffffff; --text: #0d131c; --muted: #5b6b80; --primary: #2684ff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f141b; --card: #171e28; --text: #eef3fa; --muted: #9aa8bb; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 380px; width: 100%; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { color: var(--muted); margin: 0 0 6px; font-size: 14px; }
  button { margin-top: 18px; border: 0; border-radius: 999px; padding: 10px 22px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Nexora">
  <h1>You're offline</h1>
  <p>Nexora needs a connection to load your data. Check your network and try again.</p>
  <p dir="rtl" lang="ar">أنت غير متصل. تحقق من الشبكة ثم أعد المحاولة.</p>
  <p lang="fr">Vous êtes hors ligne. Vérifiez votre connexion puis réessayez.</p>
  <button type="button" onclick="location.reload()">Try again · إعادة المحاولة</button>
</main>
</body>
</html>
